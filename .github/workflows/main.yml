name: Build Mojito Kernel - KernelSU Next Legacy + SUSFS

on:
  workflow_dispatch:
    inputs:
      use_ksu_branch:
        description: 'KernelSU Next tag/branch (v3.2.0-legacy is highest legacy for non-GKI 4.14)'
        required: false
        default: 'v3.2.0-legacy'

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Setup Build Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            git libncurses5-dev libssl-dev libelf-dev \
            python3 zip zlib1g-dev lzop rsync wget \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi binutils-aarch64-linux-gnu

      - name: Download Proton Clang 13 (compatible with kernel 4.14)
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          cd $GITHUB_WORKSPACE/clang
          curl -sL "https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz" \
            -o clang.tar.gz
          tar -xf clang.tar.gz --strip-components=1
          rm clang.tar.gz
          echo "Clang: $(bin/clang --version | head -1)"

      - name: Clone Kernel Source (fiqri19102002 mojito a11/main)
        run: |
          git clone --depth=1 \
            https://github.com/fiqri19102002/android_kernel_xiaomi_mojito \
            -b a11/main kernel-source
          echo "Cloned: $(cd kernel-source && git log --oneline -1)"
          echo "Defconfigs: $(ls kernel-source/arch/arm64/configs/ | grep -i mojito)"

      - name: Integrate KernelSU Next (kutemeikito 'next', matched to susfs v1.5.9)
        working-directory: kernel-source
        run: |
          # KSU-side: kutemeikito/KernelSU-Next 'next'. Its core_hook.c command set
          # matches susfs v1.5.9 (ShirkNeko kernel-side, applied in the next step);
          # both use susfs_try_umount(). Link manually (full clone, no --depth) so the
          # KSU version string computes from git.
          git clone https://github.com/kutemeikito/KernelSU-Next \
            -b next KernelSU-Next
          ln -sf "$(realpath --relative-to=drivers ./KernelSU-Next/kernel)" drivers/kernelsu
          grep -q "kernelsu" drivers/Makefile || \
            printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || \
            sed -i '/endmenu/i\source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          if [ -e drivers/kernelsu/Kconfig ]; then
            echo "KernelSU-Next + SUSFS linked!"
            ls drivers/kernelsu/ | head -20
            grep -R "KSU_SUSFS" drivers/kernelsu/Kconfig | head -3
          else
            echo "Integration failed!"
            exit 1
          fi

      - name: Apply SUSFS kernel-side patch (susfs4ksu kernel-4.14, ShirkNeko v1.5.9)
        working-directory: kernel-source
        run: |
          # ShirkNeko/susfs4ksu kernel-4.14 is v1.5.9 -- the version whose command set
          # (CMD_SUSFS_*) matches KernelSU-Next 'next' core_hook.c. kutemeikito's 4.14
          # branch is only v1.5.5 and lacks those commands (undeclared-identifier errors).
          git clone --depth=1 https://github.com/ShirkNeko/susfs4ksu \
            -b kernel-4.14 ../susfs4ksu
          cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/
          cp ../susfs4ksu/kernel_patches/fs/sus_su.c fs/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
          cp ../susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/
          cp ../susfs4ksu/kernel_patches/include/linux/sus_su.h include/linux/
          # KSU-Next 'next' is one symbol ahead of susfs v1.5.9: it references
          # DATA_ADB_UMOUNT_FOR_ZYGOTE_ISO_SERVICE (sibling of the SYSTEM_PROCESS macro
          # that v1.5.9 already defines). Add the missing path macro to match.
          if ! grep -q "DATA_ADB_UMOUNT_FOR_ZYGOTE_ISO_SERVICE" include/linux/susfs_def.h; then
            sed -i '/#define DATA_ADB_UMOUNT_FOR_ZYGOTE_SYSTEM_PROCESS/a #define DATA_ADB_UMOUNT_FOR_ZYGOTE_ISO_SERVICE "/data/adb/susfs_umount_for_zygote_iso_service"' include/linux/susfs_def.h
            echo "Added DATA_ADB_UMOUNT_FOR_ZYGOTE_ISO_SERVICE macro"
          fi
          grep -n "DATA_ADB_UMOUNT_FOR_ZYGOTE" include/linux/susfs_def.h
          cp ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-4.14.patch ./
          echo "=== Applying SUSFS kernel patch ===" | tee /tmp/susfs.log
          patch -p1 --no-backup-if-mismatch --fuzz=3 \
            < 50_add_susfs_in_kernel-4.14.patch 2>&1 | tee -a /tmp/susfs.log || true
          REJ=$(find . -name '*.rej' 2>/dev/null || true)
          if [ -n "$REJ" ]; then
            echo "=== SUSFS PATCH REJECTS (may break build) ===" | tee -a /tmp/susfs.log
            for f in $REJ; do echo "--- $f ---" | tee -a /tmp/susfs.log; cat "$f" | tee -a /tmp/susfs.log; done
          else
            echo "SUSFS kernel patch applied cleanly (with fuzz allowed)." | tee -a /tmp/susfs.log
          fi
          echo "susfs.c present: $([ -f fs/susfs.c ] && echo yes || echo NO)"

      - name: cred.h compat for KSU-Next SUSFS (atomic_long_t usage)
        working-directory: kernel-source
        run: |
          # KernelSU-Next's Makefile injects a get_cred_rcu() using atomic_inc_not_zero()
          # (atomic_t op) when the symbol is absent. fiqri's tree switched struct
          # cred.usage to atomic_long_t (Dec 2023), so that injection fails to compile
          # at asm-offsets. Pre-insert an atomic_long-safe get_cred_rcu so KSU's grep
          # finds it and skips its broken injection.
          if grep -q "get_cred_rcu" include/linux/cred.h; then
            echo "get_cred_rcu already present -- leaving as-is"
          else
            python3 - <<'PYEOF'
          p = 'include/linux/cred.h'
          s = open(p).read()
          func = (
              "static inline const struct cred *get_cred_rcu(const struct cred *cred)\n"
              "{\n"
              "\tstruct cred *nonconst_cred = (struct cred *) cred;\n"
              "\tif (!cred)\n"
              "\t\treturn NULL;\n"
              "\tif (!atomic_long_inc_not_zero(&nonconst_cred->usage))\n"
              "\t\treturn NULL;\n"
              "\tvalidate_creds(cred);\n"
              "\treturn cred;\n"
              "}\n\n"
          )
          anchor = "static inline void put_cred"
          assert anchor in s, "put_cred anchor not found in cred.h"
          s = s.replace(anchor, func + anchor, 1)
          open(p, 'w').write(s)
          print("Inserted atomic_long-safe get_cred_rcu before put_cred")
          PYEOF
          fi
          echo "=== cred.h get_cred_rcu / usage type ==="
          grep -n "get_cred_rcu\|atomic_long_inc_not_zero\|atomic_long_t.*usage" include/linux/cred.h | head

      - name: Enable KSU Configs in defconfig
        working-directory: kernel-source
        run: |
          DEFCONFIG=arch/arm64/configs/vendor/mojito_defconfig
          printf '%s\n' \
            "CONFIG_KSU=y" \
            "CONFIG_KSU_DEBUG=n" \
            "CONFIG_MODULES=y" \
            "CONFIG_KPROBES=y" \
            "CONFIG_KSU_KPROBES_HOOK=y" \
            "# CONFIG_KSU_MANUAL_HOOK is not set" \
            "CONFIG_THREAD_INFO_IN_TASK=y" \
            "CONFIG_KSU_SUSFS=y" \
            "# CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT is not set" \
            "CONFIG_KSU_SUSFS_SUS_PATH=y" \
            "CONFIG_KSU_SUSFS_SUS_MOUNT=y" \
            "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y" \
            "CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y" \
            "CONFIG_KSU_SUSFS_SUS_KSTAT=y" \
            "CONFIG_KSU_SUSFS_TRY_UMOUNT=y" \
            "CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y" \
            "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" \
            "CONFIG_KSU_SUSFS_ENABLE_LOG=y" \
            "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y" \
            "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y" \
            "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y" \
            "CONFIG_OVERLAY_FS=y" \
            "# CONFIG_LTO is not set" \
            "# CONFIG_LTO_CLANG is not set" \
            "# CONFIG_LTO_GCC is not set" \
            "# CONFIG_THINLTO is not set" \
            "CONFIG_LTO_NONE=y" \
            "# CONFIG_GCC_GRAPHITE is not set" \
            "# CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE_O3 is not set" \
            "CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y" \
            "# CONFIG_INIT_STACK_ALL_ZERO is not set" \
            "# CONFIG_INIT_STACK_ALL_PATTERN is not set" \
            "CONFIG_INIT_STACK_NONE=y" \
            >> $DEFCONFIG
          echo "Defconfig updated (LTO/graphite/O3/auto-init disabled for Clang)"

      - name: Build Kernel
        working-directory: kernel-source
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export KBUILD_BUILD_USER=builduser
          export KBUILD_BUILD_HOST=miui-ota-bd048-bj

          echo "=== Clang version ==="
          clang --version | head -1

          echo "=== Configuring ==="
          make O=out ARCH=arm64 vendor/mojito_defconfig
          make O=out ARCH=arm64 olddefconfig

          echo "=== Building ($(nproc) cores) ==="
          make -j$(nproc --all) O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=aarch64-linux-gnu-ld \
            LD_COMPAT=arm-linux-gnueabi-ld \
            AR=aarch64-linux-gnu-ar \
            NM=aarch64-linux-gnu-nm \
            OBJCOPY=aarch64-linux-gnu-objcopy \
            OBJDUMP=aarch64-linux-gnu-objdump \
            STRIP=aarch64-linux-gnu-strip \
            LLVM_IAS=0 \
            2>&1 | tee /tmp/build.log | grep -E "^(arch/arm64|drivers/kernelsu|Error|error:|FAILED|warning:.*KSU)" | tail -50

          echo "=== Build result ==="
          if [ -f out/arch/arm64/boot/Image ]; then
            echo "SUCCESS: $(du -sh out/arch/arm64/boot/Image)"
          else
            echo "=========== ERROR LINES ==========="
            grep -niE "error:|Error [0-9]|undefined reference|No such file|fatal error|recipe for target|\\] Error" /tmp/build.log | tail -60 || true
            echo "=========== LAST 40 LINES ==========="
            tail -40 /tmp/build.log
            exit 1
          fi

      - name: Commit build diagnostics to repo
        if: failure()
        run: |
          {
            echo "=== ERROR LINES (run ${{ github.run_number }}) ==="
            grep -niE "error:|Error [0-9]|undefined reference|No such file|fatal error|recipe for target|\] Error" /tmp/build.log 2>/dev/null | tail -80 || echo "no matches"
            echo ""
            echo "=== LAST 250 LINES ==="
            tail -250 /tmp/build.log 2>/dev/null || echo "no build.log"
            echo ""
            echo "=== SUSFS PATCH LOG ==="
            cat /tmp/susfs.log 2>/dev/null || echo "no susfs.log"
          } > /tmp/diag.txt
          B64=$(base64 -w0 /tmp/diag.txt)
          SHA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/contents/build-diag.txt" | jq -r '.sha // empty')
          jq -n --arg m "build diag run ${{ github.run_number }}" --arg c "$B64" --arg s "$SHA" \
            'if $s=="" then {message:$m,content:$c} else {message:$m,content:$c,sha:$s} end' > /tmp/put.json
          curl -s -X PUT \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/build-diag.txt" \
            -d @/tmp/put.json | jq -r '.commit.sha // .message'

      - name: Package with AnyKernel3
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AK3
          cp kernel-source/out/arch/arm64/boot/Image AK3/
          [ -f kernel-source/out/arch/arm64/boot/dtbo.img ] && \
            cp kernel-source/out/arch/arm64/boot/dtbo.img AK3/ || true
          DATE=$(date +%Y%m%d-%H%M)
          printf '%s\n' \
            "# AnyKernel3 Properties" \
            "properties() { '" \
            "kernel.string=Mojito KernelSU-Next + SUSFS v1.5.5" \
            "do.devicecheck=1" \
            "do.modules=0" \
            "do.systemless=1" \
            "do.cleanup=1" \
            "do.cleanuponabort=0" \
            "device.name1=mojito" \
            "device.name2=sunny" \
            "supported.versions=13" \
            "'; }" \
            "block=/dev/block/bootdevice/by-name/boot;" \
            "is_slot_device=0;" \
            "ramdisk_compression=auto;" \
            "patch_vbmeta_flag=auto;" \
            ". tools/ak3-core.sh;" \
            "split_boot;" \
            "flash_boot;" \
            > AK3/anykernel.sh
          cd AK3 && zip -r9 "../mojito-KSUNext-v3-${DATE}.zip" . --exclude .git
          ls -lh ../*.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mojito-KSUNext-v3-${{ github.run_number }}
          path: mojito-KSUNext-v3-*.zip
          retention-days: 30
          if-no-files-found: error
